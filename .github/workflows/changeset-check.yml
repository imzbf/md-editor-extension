name: Pull Request Checks

on:
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Build And Verify Changesets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Test Release Tooling
        run: |
          npm run test:changeset
          npm run test:release

      - name: Build Packages
        run: npm run build

      - name: Verify Changeset Coverage
        run: npm run changeset:check
        env:
          CHANGESET_BASE_REF: origin/${{ github.base_ref }}
